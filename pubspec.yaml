name: control_input_output
description: "App móvil de registro de salidas temporales y retornos del personal mediante QR."
# Aplicación privada: no se publica en pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.0.0
  cookie_jar: ^4.0.0
  dio_cookie_manager: ^3.0.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^7.4.0
  geolocator: ^14.0.2
  connectivity_plus: ^7.3.1
  path_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rsc/
